 catch(e){const m=String((e&&(e.code||e.message))||e);V.msgs[V.msgs.length-1].content=/app-?check/i.test(m)?'Chatbot setup incomplete: App Check is not configured yet.':/403|permission|not.?enabled/i.test(m)?'Chatbot is not enabled yet in Firebase (AI Logic).':'Jawab nahi mil saka, dobara try karo. ('+m.slice(0,80)+')'}
 V.busy=false;R()}
function admin(){return `<main><div class="hero sm"><button class="burger l" onclick="V.isAdmin=false;V.subEd=null;R()">←</button><h1>🛠 Admin panel</h1></div><div class="pad">
<h3>📢 Home banner</h3><input id="bt" placeholder="Banner title"><input id="bx" placeholder="Short message"><select id="bc"><option value="all">All classes</option><option value="9">Class 9 only</option><option value="10">Class 10 only</option></select><button class="btn" onclick="addBan()">Publish banner</button>
${S.banners.map(b=>`<div class="row"><span><b>${esc(b.title)}</b> <small>${b.cls=='all'?'All':'Class '+b.cls}</small></span><button class="x" onclick="fb.fs.deleteDoc(fb.fs.doc(fb.db,'banners','${b.id}'))">🗑</button></div>`).join('')}
<h3>📚 Add / edit chapter</h3><select id="tc"><option>9</option><option>10</option></select><select id="ts">${Object.keys(ICON).map(s=>`<option>${s}</option>`).join('')}</select><input id="tt" placeholder="Chapter title"><textarea id="tb" placeholder="Notes (students read this)"></textarea><input id="tp" placeholder="PDF link (Google Drive etc.) - optional"><label class="mut" style="font-size:13px">Or upload a small PDF (max 600 KB):</label><input id="tf" type="file" accept="application/pdf"><button class="btn" onclick="addTopic()">Save chapter</button><button class="btn ghost" onclick="seedAll()">Import starter chapter list</button><button class="btn ghost" onclick="addSuggested()">Add suggested topics to chapters</button><p class="mut" style="font-size:12px">Tip: tap 📑 on a chapter below to edit its topics.</p>
<details class="card"><summary><b>Manage chapters (${S.topics.length})</b></summary>${S.topics.map(x=>`<div class="row"><span><small>C${x.cls} · ${x.subj}</small><br>${esc(x.title)} ${x.body||x.pdf||x.pdfData?'':'<small>(empty)</small>'}${x.pdf||x.pdfData?' 📄':''}</span><span><button class="x" onclick="V.subEd='${x.id}';R()">📑</button><button class="x" onclick="editT('${x.id}')">✏️</button><button class="x" onclick="if(confirm('Delete this chapter?'))fb.fs.deleteDoc(fb.fs.doc(fb.db,'topics','${x.id}'))">🗑</button></span></div>`).join('')}</details>
<h3>🤖 Chatbot</h3><div class="note"><b>How instructions work:</b> the chatbot follows what you write here, on top of speaking Roman Urdu. Cover: 1) role, 2) tone, 3) answer format, 4) limits, 5) what to do when unsure.</div><textarea id="bi" placeholder="Instructions">${esc(S.bot.instr)}</textarea><button class="btn ghost" onclick="$('#bi').value=TPL">Insert professional template</button><textarea id="bn" placeholder="Training notes: formulas, definitions, school rules...">${esc(S.bot.notes)}</textarea><button class="btn" onclick="saveBot()">Save chatbot</button>
<h3>👥 Students (${S.users.length})</h3>${S.users.map(u=>`<div class="row"><span><b>@${esc(u.username)}</b><br><small>${esc(u.name)} · Class ${u.cls} · ${esc(u.field)} · ${esc(u.school)} · age ${u.age}</small></span></div>`).join('')||'<p class="mut">No students yet.</p>'}
<p class="err ok" id="err"></p></div></main>`}
const col=n=>fb.fs.collection(fb.db,n);
async function addBan(){const t=$('#bt').value.trim();if(!t)return;await fb.fs.addDoc(col('banners'),{title:t,text:$('#bx').value.trim(),cls:$('#bc').value,ts:Date.now()});$('#bt').value=$('#bx').value=''}
async function addTopic(){const t=$('#tt').value.trim();if(!t)return err('Enter a chapter title.');
 const old=(V.editId&&S.topics.find(y=>y.id==V.editId))||{},f=$('#tf').files[0];let pd=old.pdfData||'';
 if(f){if(f.size>600*1024)return err('PDF too big (max 600 KB). Upload it to Google Drive and paste the link instead.');pd=await new Promise(r=>{const o=new FileReader();o.onload=()=>r(o.result);o.readAsDataURL(f)})}
 const d={cls:$('#tc').value,subj:$('#ts').value,title:t,body:$('#tb').value,pdf:$('#tp').value.trim(),pdfData:pd};
 try{await fb.fs.setDoc(fb.fs.doc(fb.db,'topics',V.editId||'t'+Date.now()),d);V.editId=null;$('#tt').value=$('#tb').value=$('#tp').value=$('#tf').value='';err('Saved ✓')}catch(e){err('Save failed. Check rules or PDF size.')}}
function editT(i){const x=S.topics.find(y=>y.id==i);V.editId=i;$('#tc').value=x.cls;$('#ts').value=x.subj;$('#tt').value=x.title;$('#tb').value=x.body||'';$('#tp').value=x.pdf||'';$('main').scrollTop=0;err('Editing — press Save chapter.'+(x.pdfData?' (Uploaded PDF stays unless you pick a new file.)':''))}
async function saveBot(){await fb.fs.setDoc(fb.fs.doc(fb.db,'config','bot'),{instr:$('#bi').value,notes:$('#bn').value});err('Chatbot saved ✓')}
async function seedAll(){const b=fb.fs.writeBatch(fb.db);let n=0;for(const c in SEED)for(const s in SEED[c])SEED[c][s].forEach(t=>b.set(fb.fs.doc(fb.db,'topics','s'+n++),{cls:c,subj:s,title:t},{merge:true}));await b.commit();err('Starter chapters imported ✓')}

const subRows=u=>SUBJ(u).map(s=>{const n=S.topics.filter(x=>x.cls==u.cls&&x.subj==s).length;return `<div class="row sc" data-n="${s.toLowerCase()}" onclick="V.subj='${s}';R()"><div class="ic" style="background:${ICON[s][1]}33">${ICON[s][0]}</div><div class="fl"><b>${s}</b><small>Class ${u.cls} · FBISE</small></div><span class="nt">${n} Notes</span></div>`}).join('');
function flt(v){document.querySelectorAll('.sc').forEach(e=>e.style.display=(e.dataset.n||'').includes(v.toLowerCase())?'':'none')}
function splash(){return `<div class="wel"><img src="${LG}" width="150" alt=""><h1>TR Study Hub</h1><p>Empowering FBISE Students</p><div class="dots"><i></i><i></i><i></i></div><small>version 1.0.0</small></div>`}
function auth(){const s=V.m=='su';return `<main class="auth"><img src="${LL}" height="96" alt="" style="display:block;margin:0 auto"><h1>${s?'Create Account':'Welcome Back'}</h1><p class="sub2">${s?'Join TR Study Hub to start your learning journey':'Login to continue your learning journey'}</p><div class="seg"><button class="${s?'':'on'}" onclick="V.m='in';R()">Login</button><button class="${s?'on':''}" onclick="V.m='su';R()">Sign in</button></div><label>Username</label><input id="u" placeholder="${s?'e.g. ali-khan':'Your username'}" autocomplete="off" autocapitalize="none" spellcheck="false" oninput="this.value=this.value.toLowerCase().replace(${s?'/[^a-z-]/g':'/\\s/g'},'')">${s?'<small class="hint">Only small letters and dash (-). No spaces, numbers or symbols.</small>':''}<label>Password</label><input id="p" type="password" placeholder="Password" ${s?'oninput="pwm(this.value)"':''}>${s?`<div class="pbar"><i id="pb"></i></div><div class="pr" id="pr"></div><label>Confirm Password</label><input id="c" type="password" placeholder="Confirm password"><label class="ck"><input id="tc" type="checkbox"> I agree to <a onclick="V.page='terms';R()">Terms</a> &amp; <a onclick="V.page='privacy';R()">Privacy Policy</a></label>`:''}<button class="btn" onclick="${s?'signup':'signin'}()">${s?'Sign in':'Login'}</button><p class="err" id="err"></p><hr><p class="sw">${s?`Already have an account? <a onclick="V.m='in';R()">Login</a>`:`New here? <a onclick="V.m='su';R()">Sign in to create an account</a>`}</p></main>`}
function setup(){return `<main class="auth"><img src="${LL}" height="90" alt="" style="display:block;margin:0 auto"><h1>Tell us about you</h1><p class="sub2">This sets your Federal Board syllabus</p><label>Full name</label><input id="nm" placeholder="Your full name"><label>Age</label><input id="ag" type="number" placeholder="Age"><label>School name</label><input id="sc" placeholder="School name"><label>Class</label><select id="cl"><option value="9">Class 9th</option><option value="10">Class 10th</option></select><label>Field</label><select id="fl"><option>Computer Science</option><option>Biology</option><option>General</option></select><button class="btn" onclick="finish()">Start learning</button><p class="err" id="err"></p></main>`}
function home(){const u=U(),bs=S.banners.filter(b=>b.cls=='all'||b.cls==u.cls).slice(-3).reverse();
return `<div class="top"><div class="brand"><img src="${LG}" height="38" alt=""><b>TR Study Hub</b></div><span class="fb">🎓 FBISE · Class ${u.cls}</span></div><div class="pad"><h2 class="wb">Welcome back, ${esc(u.name.split(' ')[0])}!</h2><p class="mut" style="margin:4px 0 10px">Ready to continue your learning journey today?</p>${bs.map(b=>`<div class="ban"><b>📢 ${esc(b.title)}</b><span>${esc(b.text)}</span></div>`).join('')}<input placeholder="🔍 Search subjects..." oninput="flt(this.value)"><h3>Your subjects</h3>${subRows(u)}<div class="row" onclick="V.tab='prof';R()" style="cursor:pointer"><b>🔖 Saves</b><small>${u.saved.length} saved</small></div></div>`}
function subjects(){const u=U();return `<div class="top"><h2 style="margin:0">Subjects</h2><span class="fb">🎓 Federal Board FBISE</span></div><div class="pad"><div class="tabs"><button class="on">Class ${u.cls}th</button></div><input placeholder="🔍 Search subjects..." oninput="flt(this.value)">${subRows(u)}</div>`}
function subject(){const u=U(),l=S.topics.filter(x=>x.cls==u.cls&&x.subj==V.subj);return `<div class="hero sm"><button class="burger l" onclick="V.subj=null;R()">←</button><h2>${V.subj}</h2><small>TR Study Hub · Class ${u.cls} · FBISE</small></div><div class="pad"><h4 class="qa">CHAPTERS</h4>${l.length?l.map((x,i)=>`<div class="row sc" data-n="${esc(x.title.toLowerCase())}" onclick="V.read='${x.id}';R()"><span class="chn">${i+1}</span><div class="fl"><b>${esc(x.title)}</b><small>${x.body?'Notes available':'Coming soon'}</small></div>${u.saved.includes(x.id)?'🔖':''}<span class="mut">›</span></div>`).join(''):'<p class="mut">No chapters yet.</p>'}</div>`}
function reader(){const u=U(),x=S.topics.find(y=>y.id==V.read),l=S.topics.filter(y=>y.cls==x.cls&&y.subj==x.subj),i=l.findIndex(y=>y.id==x.id),sv=u.saved.includes(x.id);
return `<div class="hero sm"><button class="burger l" onclick="V.read=null;R()">←</button><small>${x.subj} · Class ${x.cls}</small><h2>${esc(x.title)}</h2></div><div class="pad"><div class="tools"><button onclick="fz(-1)">Aa−</button><button onclick="fz(1)">Aa+</button><button onclick="V.day=!V.day;R()">${V.day?'🌙 Night':'☀️ Day'}</button><button onclick="tg('${x.id}')">${sv?'🔖 Saved':'🔖 Save'}</button>${x.pdf||x.pdfData?`<button onclick="openPdf('${x.id}')">📄 PDF</button>`:''}</div><div class="rd ${V.day?'day':''}" style="font-size:${V.fs||16}px">${esc(x.body)||(x.pdf||x.pdfData?'<span class="mut">Tap the 📄 PDF button above to open the notes.</span>':'<span class="mut">Notes for this chapter are being added. Check back soon.</span>')}</div>${subsHtml(x)}<div class="pn"><button class="btn ghost" ${i>0?`onclick="V.read='${l[i-1].id}';R()"`:'disabled'}>‹ Previous</button><button class="btn ghost" ${i<l.length-1?`onclick="V.read='${l[i+1].id}';R()"`:'disabled'}>Next ›</button></div></div><button class="fab" onclick="askAbout('${x.id}')">💬 Ask Doubt</button>`}
function fz(d){V.fs=Math.min(26,Math.max(12,(V.fs||16)+d*2));R()}

async function addSuggested(){const b=fb.fs.writeBatch(fb.db);let n=0;S.topics.forEach(x=>{const k=SUBS[x.cls+'|'+x.title];if(k&&!(x.subs&&x.subs.length)){n++;b.set(fb.fs.doc(fb.db,'topics',x.id),{subs:k.split('|').map(t=>({t,b:'',p:''}))},{merge:true})}});if(!n)return err('Nothing to add (topics already exist or import chapters first).');await b.commit();err(n+' chapters updated with topics ✓')}
function subsHtml(x){const L=x.subs||[];if(!L.length)return '';return `<h3>Topics</h3>${L.map(s=>`<details class="card"><summary><b>${esc(s.t)}</b></summary><div class="rd2" style="margin-top:8px;white-space:pre-wrap;font-size:${V.fs||16}px">${esc(s.b)||'<span class="mut">Notes for this topic are coming soon.</span>'}</div>${s.p?`<a class="btn" style="display:block;text-align:center;text-decoration:none;color:#fff" href="${esc(s.p)}" target="_blank" rel="noopener">📄 Open PDF</a>`:''}</details>`).join('')}`}
function subAdmin(){const x=S.topics.find(y=>y.id==V.subEd);if(!x){V.subEd=null;return admin()}const L=x.subs||[];
return `<main><div class="hero sm"><button class="burger l" onclick="V.subEd=null;R()">←</button><small>${x.subj} · Class ${x.cls}</small><h2>${esc(x.title)}</h2></div><div class="pad"><h3>Topics (${L.length})</h3>${L.map((s,i)=>`<div class="card"><input id="st${i}" value="${esc(s.t)}"><textarea id="sb${i}" placeholder="Notes">${esc(s.b)}</textarea><input id="sp${i}" value="${esc(s.p||'')}" placeholder="PDF link (optional)"><div class="pn"><button class="btn" onclick="saveSub(${i})">Save</button><button class="btn ghost" onclick="delSub(${i})">Delete</button></div></div>`).join('')||'<p class="mut">No topics yet.</p>'}<h3>Add topic</h3><input id="nt" placeholder="Topic title"><textarea id="nb" placeholder="Notes"></textarea><input id="nsp" placeholder="PDF link (optional)"><button class="btn" onclick="addSub()">Add topic</button><p class="err ok" id="err"></p></div></main>`}

function saveSub(i){const x=S.topics.find(y=>y.id==V.subEd),L=[...(x.subs||[])];const t=$('#st'+i).value.trim();if(!t)return err('Title needed.');L[i]={t,b:$('#sb'+i).value,p:$('#sp'+i).value.trim()};putSubs(L,'Saved ✓')}
function delSub(i){if(!confirm('Delete this topic?'))return;const x=S.topics.find(y=>y.id==V.subEd),L=[...(x.subs||[])];L.splice(i,1);putSubs(L,'Deleted')}
function addSub(){const t=$('#nt').value.trim();if(!t)return err('Enter a topic title.');const x=S.topics.find(y=>y.id==V.subEd),L=[...(x.subs||[]),{t,b:$('#nb').value,p:$('#nsp').value.trim()}];putSubs(L,'Topic added ✓')}
